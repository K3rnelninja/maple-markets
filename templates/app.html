<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>Maple Markets</title>
<style>
:root{
--bg:#0a0a0f;--card:#12121a;--border:#1a1a2e;--accent:#e63946;
--green:#2ecc71;--red:#e74c3c;--gold:#f1c40f;--blue:#3498db;--purple:#9b59b6;
--text:#e8e8f0;--dim:#6b6b80;--muted:#3d3d50;--grid:#1a1a28;--bgl:#00e676;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.mono{font-family:'SF Mono',SFMono-Regular,'Cascadia Code',Menlo,monospace}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* Header */
.header{padding:env(safe-area-inset-top,12px) 20px 8px;position:sticky;top:0;z-index:10;background:var(--bg)}
.header-row{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;gap:8px;align-items:center}
.brand-maple{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:3px}
.brand-markets{font-size:11px;font-weight:300;color:var(--dim);letter-spacing:3px}
.subtitle{font-size:9px;color:var(--dim);margin-top:2px}

/* VIX Badge */
.vix-badge{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:10px}
.vix-dot{width:6px;height:6px;border-radius:3px}

/* Tabs */
.tab-bar{display:flex;padding:6px 0 env(safe-area-inset-bottom,20px);background:#08080d;border-top:1px solid var(--border);position:sticky;bottom:0;z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:opacity .2s;opacity:.4;border:none;background:none;color:var(--dim);padding:4px 0}
.tab.active{opacity:1;color:var(--accent)}
.tab svg{width:20px;height:20px}
.tab-label{font-size:9px;font-weight:400}
.tab.active .tab-label{font-weight:700}

/* Content */
.content{flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
.page{display:none}.page.active{display:block}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;flex:1;min-width:0}
.stat-label{font-size:10px;color:var(--dim);margin-bottom:2px}
.stat-value{font-size:20px;font-weight:700}
.stat-sub{font-size:9px;color:var(--dim);margin-top:1px}
.row{display:flex;gap:6px}
.section-title{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:1px;margin:12px 0 8px}

/* Signal Card */
.signal{position:relative;overflow:hidden}
.signal.active{border-color:rgba(255,255,255,.1)}
.signal-bar{position:absolute;top:0;left:0;right:0;height:2px}
.signal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.signal-name{font-size:13px;font-weight:600}
.signal-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.signal-desc{font-size:10px;color:var(--dim);margin-bottom:4px}
.conf-bar-bg{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.conf-bar-fill{height:100%;border-radius:2px}

/* Trade Row */
.trade-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:8px}
.trade-row:last-child{border-bottom:none}
.trade-idx{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.trade-dir{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px}
.trade-date{font-size:10px;color:var(--dim)}
.trade-levels{font-size:9px;color:var(--muted);margin-top:2px}
.trade-pnl{font-size:13px;font-weight:700;text-align:right}

/* Confluence box */
.confluence-box{border-radius:12px;padding:14px;margin-top:8px}
.confluence-title{font-size:11px;font-weight:700;margin-bottom:4px}
.confluence-desc{font-size:10px;color:var(--dim);line-height:1.5}

/* Win rate ring */
.ring-container{position:relative;width:80px;height:80px;flex-shrink:0}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:18px;font-weight:700}
.ring-label{font-size:8px;color:var(--dim)}

/* Weekly row */
.weekly-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.weekly-row:last-child{border-bottom:none}
.weekly-name{font-size:10px}
.weekly-detail{font-size:9px;color:var(--dim)}
.weekly-pnl{font-size:12px;font-weight:700}

/* Indicator badge */
.ind-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;margin:0 4px 4px 0}
.ind-dot{width:4px;height:4px;border-radius:2px}
.ind-label{font-size:9px;color:var(--dim)}
.ind-value{font-size:9px;font-weight:600}

/* Insight box */
.insight{border-radius:12px;padding:12px;margin-top:12px}
.insight-title{font-size:10px;font-weight:700;margin-bottom:4px}
.insight-text{font-size:10px;color:var(--dim);line-height:1.5}

/* Price display */
.price-big{font-size:28px;font-weight:700;margin-bottom:8px}
.price-change{font-size:12px;margin-left:8px}

/* Canvas charts */
canvas{display:block;width:100%;border-radius:8px}

/* Loading */
.loading{text-align:center;padding:40px;color:var(--dim);font-size:12px}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.loading::after{content:'';display:block;width:20px;height:20px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;margin:12px auto;animation:pulse .8s infinite}
</style>
</head>
<body>
<div class="app">
<!-- Header -->
<div class="header">
<div class="header-row">
<div>
<div class="brand mono"><span class="brand-maple">MAPLE</span><span class="brand-markets">MARKETS</span></div>
<div class="subtitle mono" id="subtitle">ES · 5min · Loading...</div>
</div>
<div class="vix-badge mono" id="vix-badge" style="background:rgba(241,196,15,.08);border:1px solid rgba(241,196,15,.2)">
<div class="vix-dot" style="background:var(--gold);box-shadow:0 0 6px var(--gold)"></div>
<span id="vix-text" style="color:var(--gold);font-weight:600">VIX --</span>
<span style="color:var(--dim)">·</span>
<span id="vix-regime" style="color:var(--dim)">--</span>
</div>
</div>
</div>

<!-- Content -->
<div class="content">
<div class="page active" id="page-chart"></div>
<div class="page" id="page-signals"></div>
<div class="page" id="page-trades"></div>
<div class="page" id="page-stats"></div>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
<button class="tab active" data-tab="chart" onclick="switchTab('chart')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
<span class="tab-label mono">Chart</span>
</button>
<button class="tab" data-tab="signals" onclick="switchTab('signals')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
<span class="tab-label mono">Signals</span>
</button>
<button class="tab" data-tab="trades" onclick="switchTab('trades')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>
<span class="tab-label mono">Trades</span>
</button>
<button class="tab" data-tab="stats" onclick="switchTab('stats')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
<span class="tab-label mono">Stats</span>
</button>
</div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────
let STATE = { trades:[], stats:null, gex:null, tab:'chart', price:0, priceChange:0, priceChangePct:0, vix:0, vixRegime:'--', candles:[], live:false, lastFetch:null, error:null };
const API = '';  // same origin

// ── Tab Switching ──────────────────────────────────────────────────
function switchTab(tab) {
  STATE.tab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
}

// ── Data Fetching ──────────────────────────────────────────────────
async function fetchData() {
  try {
    const [tradesRes, statsRes, marketRes] = await Promise.all([
      fetch(API+'/api/trades'), fetch(API+'/api/stats'), fetch(API+'/api/market')
    ]);
    STATE.trades = (await tradesRes.json()).trades;
    STATE.stats = await statsRes.json();
    
    const market = await marketRes.json();
    if (market.es && market.es.price) {
      STATE.price = market.es.price;
      STATE.priceChange = market.es.change || 0;
      STATE.priceChangePct = market.es.changePct || 0;
      STATE.candles = market.es.candles || [];
    }
    if (market.vix && market.vix.value) {
      STATE.vix = market.vix.value;
      STATE.vixRegime = market.vix.regime || '--';
    }
    STATE.live = market.live || false;
    STATE.lastFetch = market.fetched_at;
    STATE.error = market.error;
  } catch(e) { 
    console.log('Fetch error:', e);
    STATE.live = false;
    STATE.error = e.toString();
  }
  render();
}

// ── Render Functions ───────────────────────────────────────────────
function render() {
  const s = STATE.stats;
  if (!s) return;
  
  // Update subtitle with live/dead status
  const statusDot = STATE.live ? '🟢' : '🔴';
  const statusText = STATE.live ? 'LIVE' : 'OFFLINE';
  document.getElementById('subtitle').textContent = `ES · 5min · ${statusDot} ${statusText} · ${new Date().toLocaleDateString()}`;
  
  // Update VIX badge
  const vixColor = STATE.vix < 15 ? '--green' : STATE.vix > 25 ? '--red' : '--gold';
  const vixBadge = document.getElementById('vix-badge');
  const vixDot = vixBadge.querySelector('.vix-dot');
  vixBadge.style.background = `var(${vixColor})12`;
  vixBadge.style.borderColor = `var(${vixColor})33`;
  vixDot.style.background = `var(${vixColor})`;
  vixDot.style.boxShadow = `0 0 6px var(${vixColor})`;
  document.getElementById('vix-text').textContent = STATE.vix > 0 ? `VIX ${STATE.vix.toFixed(1)}` : 'VIX --';
  document.getElementById('vix-text').style.color = `var(${vixColor})`;
  document.getElementById('vix-regime').textContent = STATE.vixRegime;
  
  renderChart(); renderSignals(); renderTrades(); renderStats();
}

function renderChart() {
  const el = document.getElementById('page-chart');
  const candles = STATE.candles.length > 0 ? STATE.candles : generateCandles(60);
  const lastPrice = STATE.price > 0 ? STATE.price : (candles.length > 0 ? candles[candles.length-1].c : 0);
  const change = STATE.priceChange;
  const changePct = STATE.priceChangePct;
  const changeColor = change >= 0 ? 'var(--green)' : 'var(--red)';
  const changeSign = change >= 0 ? '+' : '';
  
  // Compute BGL (21 EMA) from live candles
  let bglVal = 0;
  if (candles.length > 0) {
    const k = 2/22;
    let ema = candles[0].c;
    for (let i=1;i<candles.length;i++) ema = candles[i].c*k + ema*(1-k);
    bglVal = ema;
  }
  
  // Compute VWAP approximation (simple average of hlc3)
  let vwapVal = 0;
  if (candles.length > 0) {
    let sumPV = 0, sumV = 0;
    candles.forEach(c => { const tp=(c.h+c.l+c.c)/3; sumPV+=tp; sumV+=1; });
    vwapVal = sumPV/sumV;
  }
  
  // Determine ORB (first 6 candles = 30min on 5min chart)
  let orbHigh = 0, orbLow = 999999;
  const orbBars = Math.min(6, candles.length);
  for (let i=0;i<orbBars;i++) { orbHigh=Math.max(orbHigh,candles[i].h); orbLow=Math.min(orbLow,candles[i].l); }
  
  const priceAboveBGL = lastPrice > bglVal;
  const bglSignal = priceAboveBGL ? 'LONG' : 'SHORT';
  const bglConf = priceAboveBGL ? (lastPrice-bglVal > 5 ? 72 : 55) : (bglVal-lastPrice > 5 ? 72 : 55);
  const bglDesc = priceAboveBGL ? 'Price above 21 EMA · Trending up' : 'Price below 21 EMA · Trending down';
  
  const isLive = STATE.candles.length > 0;
  
  el.innerHTML = `
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">
      <span class="price-big mono">${lastPrice.toFixed(2)}</span>
      <span class="price-change mono" style="color:${changeColor}">${changeSign}${change.toFixed(2)} (${changeSign}${changePct.toFixed(2)}%)</span>
    </div>
    ${!isLive ? '<div style="font-size:9px;color:var(--gold);margin-bottom:4px" class="mono">⏳ Market closed — showing last session</div>' : ''}
    <div class="card" style="padding:0;overflow:hidden">
      <canvas id="chart-canvas" height="220"></canvas>
    </div>
    <div style="display:flex;flex-wrap:wrap;margin:12px 0">
      ${indBadge('BGL 21', bglVal.toFixed(1), '--bgl')}
      ${indBadge('ORB High', orbHigh.toFixed(1), '--blue')}
      ${indBadge('ORB Low', orbLow > 99999 ? '--' : orbLow.toFixed(1), '--purple')}
      ${indBadge('VWAP', vwapVal.toFixed(1), '--gold')}
    </div>
    <div class="section-title mono">ACTIVE STRATEGIES</div>
    ${signalCard('Black ASP v1.1.0', bglSignal==='SHORT'?'SHORT':'LONG', 65, 'ES @ '+lastPrice.toFixed(1)+' · VIX: '+STATE.vix.toFixed(1)+' '+STATE.vixRegime, true)}
    ${signalCard('BGL Trend', bglSignal, bglConf, bglDesc, true)}
    ${signalCard('ORB Breakout', lastPrice>orbHigh?'LONG':lastPrice<orbLow?'SHORT':null, lastPrice>orbHigh||lastPrice<orbLow?60:null, lastPrice>orbHigh?'Price above ORB high '+orbHigh.toFixed(1):lastPrice<orbLow?'Price below ORB low '+orbLow.toFixed(1):'Waiting — price inside opening range', lastPrice>orbHigh||lastPrice<orbLow)}
  `;
  drawCandlestickChart('chart-canvas', candles, 220);
}

function renderSignals() {
  const el = document.getElementById('page-signals');
  el.innerHTML = `
    <div class="section-title mono">STRATEGY SIGNALS</div>
    ${signalCard('Black ASP v1.1.0','SHORT',65,'ES short entry @ 6801 · Institutional Activity TIER 1 detected',true)}
    ${signalCard('BGL (21 EMA)','SHORT',72,'Price crossed below BGL from prev close · Entry pts: 3',true)}
    ${signalCard('VIX Regime Filter',null,null,'VIX 22.4 = MODERATE · Trend trades valid · Normal stops',false)}
    ${signalCard('0DTE ORB (60min)','LONG',58,'SPY broke above opening range high @ 541.20 · ATM call',true)}
    ${signalCard('Credit Spread (0DTE)',null,null,'No setup · Need 0.2% min opening range for entry',false)}
    <div class="confluence-box" style="background:rgba(231,76,60,.06);border:1px solid rgba(231,76,60,.2)">
      <div class="confluence-title mono" style="color:var(--red)">CONFLUENCE: BEARISH (2/3)</div>
      <div class="confluence-desc">Black ASP + BGL agree on SHORT. ORB disagrees. VIX moderate — trend trades preferred over breakouts.</div>
    </div>
  `;
}

function renderTrades() {
  const el = document.getElementById('page-trades');
  const s = STATE.stats;
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="section-title mono" style="margin:0">BLACK ASP TRADE LOG</div>
      <span class="mono" style="font-size:10px;font-weight:700;color:${s.total_pnl>=0?'var(--green)':'var(--red)'}">$${s.total_pnl>=0?'+':''}${Math.round(s.total_pnl)}</span>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <canvas id="equity-canvas" height="90"></canvas>
    </div>
    <div class="card" style="padding:4px 12px">
      ${STATE.trades.slice().reverse().map((t,i)=>tradeRow(t, STATE.trades.length-i)).join('')}
    </div>
  `;
  drawEquityCurve('equity-canvas', s.equity_curve, 90);
}

function renderStats() {
  const el = document.getElementById('page-stats');
  const s = STATE.stats;
  el.innerHTML = `
    <div class="section-title mono" style="margin-top:0">BLACK ASP v1.1.0 — PERFORMANCE</div>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
      <div class="ring-container">
        <svg viewBox="0 0 80 80" width="80" height="80">
          <circle cx="40" cy="40" r="36" fill="none" stroke="var(--border)" stroke-width="4"/>
          <circle cx="40" cy="40" r="36" fill="none" stroke="${s.win_rate>=50?'var(--green)':'var(--red)'}" stroke-width="4"
            stroke-dasharray="${2*Math.PI*36}" stroke-dashoffset="${2*Math.PI*36*(1-s.win_rate/100)}"
            stroke-linecap="round" transform="rotate(-90 40 40)"/>
        </svg>
        <div class="ring-text"><span class="ring-pct mono">${Math.round(s.win_rate)}%</span><span class="ring-label">WIN RATE</span></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <div class="row">${statCard('TRADES',s.total_trades,'--text')}${statCard('P/F',s.profit_factor.toFixed(2),s.profit_factor>=1?'--green':'--red')}</div>
        <div class="row">${statCard('AVG WIN','$'+Math.round(s.avg_win),'--green')}${statCard('AVG LOSS','$'+Math.abs(Math.round(s.avg_loss)),'--red')}</div>
      </div>
    </div>
    <div class="row" style="margin-bottom:12px">
      ${statCard('TOTAL PNL','$'+(s.total_pnl>=0?'+':'')+Math.round(s.total_pnl),s.total_pnl>=0?'--green':'--red',(s.total_pnl/s.total_trades).toFixed(1)+'/trade')}
      ${statCard('WINS',s.wins+'W','--green','$'+Math.round(s.wins>0?s.avg_win*s.wins:0)+' total')}
      ${statCard('LOSSES',s.losses+'L','--red','$'+Math.abs(Math.round(s.losses>0?s.avg_loss*s.losses:0))+' total')}
    </div>
    <div class="section-title mono">BY DIRECTION</div>
    <div class="row" style="margin-bottom:12px">
      ${statCard('LONG',Math.round(s.long_win_rate)+'%','--green',s.long_trades+' trades · $'+Math.round(s.long_pnl))}
      ${statCard('SHORT',Math.round(s.short_win_rate)+'%','--red',s.short_trades+' trades · $'+Math.round(s.short_pnl))}
    </div>
    <div class="section-title mono">BY WEEK</div>
    <div class="card">
      ${s.weekly.map((w,i)=>`
        <div class="weekly-row"${i===s.weekly.length-1?' style="border-bottom:none"':''}>
          <div><div class="weekly-name mono">${w.week}</div>
          <div class="weekly-detail mono">${w.trades} trades · ${w.wins}W ${w.trades-w.wins}L · ${Math.round(w.wins/w.trades*100)}%</div></div>
          <div class="weekly-pnl mono" style="color:${w.pnl>=0?'var(--green)':'var(--red)'}">${w.pnl>=0?'+':''}$${Math.round(w.pnl)}</div>
        </div>
      `).join('')}
    </div>
    <div class="insight" style="background:rgba(241,196,15,.05);border:1px solid rgba(241,196,15,.12)">
      <div class="insight-title mono" style="color:var(--gold)">INSIGHT</div>
      <div class="insight-text">Week 1 had strong directional trend (selloff) — 67% WR, +$1,531. Weeks 2-4 were choppy/ranging. VIX filter + BGL confluence now active in v1.1.0 to skip chop.</div>
    </div>
  `;
}

// ── HTML Helpers ────────────────────────────────────────────────────
function signalCard(name, signal, conf, desc, active) {
  const sc = !signal ? 'var(--gold)' : signal==='LONG' ? 'var(--green)' : 'var(--red)';
  return `<div class="card signal${active?' active':''}" style="${active?'border-color:'+sc+'33':''}">
    ${active?`<div class="signal-bar" style="background:linear-gradient(90deg,transparent,${sc},transparent)"></div>`:''}
    <div class="signal-head">
      <div class="signal-name">${name}</div>
      <div class="signal-badge mono" style="color:${sc};background:${sc}18">${signal||'FLAT'}</div>
    </div>
    <div class="signal-desc">${desc}</div>
    ${conf!=null?`<div style="display:flex;align-items:center;gap:6px">
      <div class="conf-bar-bg"><div class="conf-bar-fill" style="width:${conf}%;background:${sc}"></div></div>
      <span class="mono" style="font-size:9px;color:var(--dim)">${conf}%</span>
    </div>`:''}
  </div>`;
}

function statCard(label, value, colorVar, sub) {
  return `<div class="stat-card"><div class="stat-label mono">${label}</div>
    <div class="stat-value mono" style="color:var(${colorVar})">${value}</div>
    ${sub?`<div class="stat-sub mono">${sub}</div>`:''}
  </div>`;
}

function indBadge(label, value, colorVar) {
  return `<div class="ind-badge" style="background:var(${colorVar})10;border:1px solid var(${colorVar})25">
    <div class="ind-dot" style="background:var(${colorVar})"></div>
    <span class="ind-label mono">${label}</span>
    <span class="ind-value mono" style="color:var(${colorVar})">${value}</span>
  </div>`;
}

function tradeRow(t, idx) {
  const w = t.pnl > 0;
  const dc = t.dir==='LONG' ? '--green' : '--red';
  return `<div class="trade-row">
    <div class="trade-idx mono" style="color:var(${w?'--green':'--red'});background:var(${w?'--green':'--red'})18">${idx}</div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;gap:6px;align-items:center">
        <span class="trade-dir mono" style="color:var(${dc});background:var(${dc})18">${t.dir}</span>
        <span class="trade-date mono">${t.date}</span>
      </div>
      <div class="trade-levels mono">${t.entry.toFixed(2)} → ${t.exit.toFixed(2)}</div>
    </div>
    <div class="trade-pnl mono" style="color:var(${w?'--green':'--red'})">${w?'+':''}$${Math.round(t.pnl)}</div>
  </div>`;
}

// ── Canvas Drawing ─────────────────────────────────────────────────
function generateCandles(n) {
  const candles = [];
  let p = 6800;
  for (let i=0;i<n;i++) {
    const o = p + (Math.random()-.48)*15;
    const c = o + (Math.random()-.48)*20;
    const h = Math.max(o,c)+Math.random()*10;
    const l = Math.min(o,c)-Math.random()*10;
    candles.push({o,h,l,c,t:i});
    p = c;
  }
  return candles;
}

function drawCandlestickChart(id, candles, height) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth;
  canvas.width = w * dpr; canvas.height = height * dpr;
  canvas.style.width = w+'px'; canvas.style.height = height+'px';
  ctx.scale(dpr, dpr);
  
  const pad = {t:10,r:8,b:20,l:45};
  const cw = w-pad.l-pad.r, ch = height-pad.t-pad.b;
  const allP = candles.flatMap(c=>[c.h,c.l]);
  const minP = Math.min(...allP), maxP = Math.max(...allP);
  const range = maxP-minP||1;
  const gap = cw/candles.length, candleW = Math.max(2, gap*.7);
  const toY = p => pad.t+ch-((p-minP)/range)*ch;
  
  // Grid
  ctx.strokeStyle='#1a1a28'; ctx.lineWidth=.5;
  ctx.font='9px SFMono-Regular,monospace'; ctx.fillStyle='#3d3d50'; ctx.textAlign='right';
  for(let i=0;i<5;i++){
    const p=minP+(range/4)*i, y=toY(p);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();
    ctx.fillText(p.toFixed(0),pad.l-4,y+3);
  }
  
  // EMA 21
  const k=2/22; let ema=[candles[0].c];
  for(let i=1;i<candles.length;i++) ema.push(candles[i].c*k+ema[i-1]*(1-k));
  ctx.beginPath(); ctx.strokeStyle='#00e67699'; ctx.lineWidth=1.5;
  ema.forEach((v,i)=>{const x=pad.l+i*gap+gap/2;i===0?ctx.moveTo(x,toY(v)):ctx.lineTo(x,toY(v))});
  ctx.stroke();
  
  // Candles
  candles.forEach((c,i)=>{
    const x=pad.l+i*gap+gap/2;
    const bull=c.c>=c.o; const col=bull?'#2ecc71':'#e74c3c';
    ctx.strokeStyle=col;ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(x,toY(c.h));ctx.lineTo(x,toY(c.l));ctx.stroke();
    const bt=toY(Math.max(c.o,c.c)),bb=toY(Math.min(c.o,c.c));
    ctx.fillStyle=col;ctx.globalAlpha=.9;
    ctx.fillRect(x-candleW/2,bt,candleW,Math.max(1,bb-bt));ctx.globalAlpha=1;
  });
  
  // Price line
  const last=candles[candles.length-1], py=toY(last.c);
  ctx.setLineDash([3,3]);ctx.strokeStyle='#f1c40f';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(pad.l,py);ctx.lineTo(w-pad.r,py);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#f1c40f';
  const lw=44,lh=14;ctx.fillRect(w-pad.r-lw,py-lh/2,lw,lh);
  ctx.fillStyle='#000';ctx.font='bold 8px SFMono-Regular,monospace';ctx.textAlign='center';
  ctx.fillText(last.c.toFixed(1),w-pad.r-lw/2,py+3);
}

function drawEquityCurve(id, curve, height) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth;
  canvas.width = w*dpr; canvas.height = height*dpr;
  canvas.style.width = w+'px'; canvas.style.height = height+'px';
  ctx.scale(dpr, dpr);
  
  const pad=8, cw=w-pad*2, ch=height-pad*2;
  const pts=[0,...curve];
  const minE=Math.min(...pts),maxE=Math.max(...pts),range=maxE-minE||1;
  const final=pts[pts.length-1], pos=final>=0;
  const toX=i=>pad+(i/(pts.length-1))*cw;
  const toY=v=>pad+ch-((v-minE)/range)*ch;
  
  // Zero line
  ctx.setLineDash([2,2]);ctx.strokeStyle='#3d3d50';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(pad,toY(0));ctx.lineTo(w-pad,toY(0));ctx.stroke();ctx.setLineDash([]);
  
  // Line
  ctx.beginPath();ctx.strokeStyle=pos?'#2ecc71':'#e74c3c';ctx.lineWidth=1.5;
  pts.forEach((v,i)=>{i===0?ctx.moveTo(toX(i),toY(v)):ctx.lineTo(toX(i),toY(v))});ctx.stroke();
  
  // Peak dot
  const pi=pts.indexOf(maxE);
  ctx.beginPath();ctx.arc(toX(pi),toY(maxE),3,0,Math.PI*2);ctx.fillStyle='#f1c40f';ctx.fill();
  
  // Labels
  ctx.font='8px SFMono-Regular,monospace';ctx.textAlign='left';ctx.fillStyle='#6b6b80';
  ctx.fillText('Peak: $'+Math.round(maxE),pad+2,pad+10);
  ctx.textAlign='right';ctx.fillStyle=pos?'#2ecc71':'#e74c3c';
  ctx.fillText('Now: $'+Math.round(final),w-pad-2,height-pad-2);
}
