<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>Maple Markets</title>
<style>
:root{
--bg:#0a0a0f;--card:#12121a;--border:#1a1a2e;--accent:#e63946;
--green:#2ecc71;--red:#e74c3c;--gold:#f1c40f;--blue:#3498db;--purple:#9b59b6;
--text:#e8e8f0;--dim:#6b6b80;--muted:#3d3d50;--grid:#1a1a28;--bgl:#00e676;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.mono{font-family:'SF Mono',SFMono-Regular,Menlo,monospace}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{padding:env(safe-area-inset-top,12px) 20px 8px;position:sticky;top:0;z-index:10;background:var(--bg)}
.header-row{display:flex;justify-content:space-between;align-items:center}
.brand-maple{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:3px}
.brand-markets{font-size:11px;font-weight:300;color:var(--dim);letter-spacing:3px}
.subtitle{font-size:9px;color:var(--dim);margin-top:2px}
.vix-badge{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:10px;border:1px solid}
.vix-dot{width:6px;height:6px;border-radius:3px}
.tab-bar{display:flex;padding:6px 0 env(safe-area-inset-bottom,20px);background:#08080d;border-top:1px solid var(--border);position:sticky;bottom:0;z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:opacity .2s;opacity:.4;border:none;background:none;color:var(--dim);padding:4px 0}
.tab.active{opacity:1;color:var(--accent)}
.tab-icon{font-size:18px}
.tab-label{font-size:9px;font-weight:400}
.tab.active .tab-label{font-weight:700}
.content{flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;flex:1;min-width:0}
.stat-label{font-size:10px;color:var(--dim);margin-bottom:2px}
.stat-value{font-size:18px;font-weight:700}
.stat-sub{font-size:9px;color:var(--dim);margin-top:1px}
.row{display:flex;gap:6px;margin-bottom:8px}
.section-title{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:1px;margin:12px 0 8px;display:flex;justify-content:space-between;align-items:center}
.signal{position:relative;overflow:hidden}
.signal-bar{position:absolute;top:0;left:0;right:0;height:2px}
.signal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.signal-name{font-size:13px;font-weight:600}
.signal-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}
.signal-desc{font-size:10px;color:var(--dim);margin-bottom:4px}
.conf-bar-bg{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.conf-bar-fill{height:100%;border-radius:2px}
.trade-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:8px}
.trade-row:last-child{border-bottom:none}
.trade-idx{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.trade-dir{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px}
.price-big{font-size:28px;font-weight:700;margin-bottom:4px}
.price-change{font-size:12px;margin-left:8px}
canvas{display:block;width:100%;border-radius:8px}
.ind-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;margin:0 4px 4px 0}
.ind-dot{width:4px;height:4px;border-radius:2px}
.confluence-box{border-radius:12px;padding:14px;margin-top:8px}
.confluence-title{font-size:11px;font-weight:700;margin-bottom:4px}
.confluence-desc{font-size:10px;color:var(--dim);line-height:1.5}
.weekly-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.weekly-row:last-child{border-bottom:none}
.ring-container{position:relative;width:80px;height:80px;flex-shrink:0}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.insight{border-radius:12px;padding:12px;margin-top:12px}
.filter-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--dim);font-size:10px;font-weight:600;font-family:'SF Mono',monospace;cursor:pointer;margin-right:6px}
.filter-btn.active{background:rgba(230,57,70,.2);color:var(--accent);border-color:var(--accent)}
.flag{font-size:8px;color:var(--muted);margin-left:4px;background:rgba(107,107,128,.2);padding:1px 4px;border-radius:3px;font-family:'SF Mono',monospace}
.btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:10px;font-family:'SF Mono',monospace;cursor:pointer;font-weight:600}
.btn-primary{background:var(--accent);border-color:var(--accent);color:white}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn-sm{padding:3px 8px;font-size:9px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}
.modal-content{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:14px;font-weight:700;margin-bottom:16px;color:var(--text)}
.form-group{margin-bottom:12px}
.form-label{font-size:10px;color:var(--dim);margin-bottom:4px;display:block;font-family:'SF Mono',monospace}
.form-input,.form-select{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;font-family:'SF Mono',monospace}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--accent)}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1;padding:10px}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="header-row">
<div>
<div class="mono"><span class="brand-maple">MAPLE</span>&nbsp;<span class="brand-markets">MARKETS</span></div>
<div class="subtitle mono" id="subtitle">ES · 5min · Loading...</div>
</div>
<div class="vix-badge mono" id="vix-badge" style="background:rgba(241,196,15,.08);border-color:rgba(241,196,15,.2)">
<div class="vix-dot" style="background:var(--gold);box-shadow:0 0 6px var(--gold)"></div>
<span id="vix-text" style="color:var(--gold);font-weight:600">VIX --</span>
<span style="color:var(--dim)">·</span>
<span id="vix-regime" style="color:var(--dim)">--</span>
</div>
</div>
</div>

<div class="content">
<div class="page active" id="page-daytrade"></div>
<div class="page" id="page-swing"></div>
<div class="page" id="page-rrsp"></div>
<div class="page" id="page-trades"></div>
<div class="page" id="page-stats"></div>
</div>

<div class="tab-bar">
<button class="tab active" data-tab="daytrade" onclick="switchTab('daytrade')"><span class="tab-icon">⚡</span><span class="tab-label mono">Day Trade</span></button>
<button class="tab" data-tab="swing" onclick="switchTab('swing')"><span class="tab-icon">🔄</span><span class="tab-label mono">Swing</span></button>
<button class="tab" data-tab="rrsp" onclick="switchTab('rrsp')"><span class="tab-icon">🍁</span><span class="tab-label mono">RRSP</span></button>
<button class="tab" data-tab="trades" onclick="switchTab('trades')"><span class="tab-icon">📋</span><span class="tab-label mono">Trades</span></button>
<button class="tab" data-tab="stats" onclick="switchTab('stats')"><span class="tab-icon">📈</span><span class="tab-label mono">Stats</span></button>
</div>
</div>

<!-- RRSP Edit Modal -->
<div class="modal" id="rrsp-modal">
<div class="modal-content">
<div class="modal-title" id="rrsp-modal-title">Add Holding</div>
<input type="hidden" id="rrsp-id">
<div class="form-row">
<div class="form-group"><label class="form-label">TICKER</label><input class="form-input" id="rrsp-ticker"></div>
<div class="form-group"><label class="form-label">COUNTRY</label><select class="form-select" id="rrsp-country"><option value="CA">🇨🇦 CA</option><option value="US">🇺🇸 US</option></select></div>
</div>
<div class="form-group"><label class="form-label">COMPANY NAME</label><input class="form-input" id="rrsp-name"></div>
<div class="form-row">
<div class="form-group"><label class="form-label">SECTOR</label><input class="form-input" id="rrsp-sector"></div>
<div class="form-group"><label class="form-label">RATING</label><select class="form-select" id="rrsp-rating"><option>BUY</option><option>HOLD</option><option>SELL</option></select></div>
</div>
<div class="form-row">
<div class="form-group"><label class="form-label">SHARES</label><input class="form-input" id="rrsp-shares" type="number" step="0.01"></div>
<div class="form-group"><label class="form-label">AVG COST</label><input class="form-input" id="rrsp-avgCost" type="number" step="0.01"></div>
<div class="form-group"><label class="form-label">PRICE</label><input class="form-input" id="rrsp-price" type="number" step="0.01"></div>
</div>
<div class="form-row">
<div class="form-group"><label class="form-label">YIELD %</label><input class="form-input" id="rrsp-yield" type="number" step="0.01"></div>
<div class="form-group"><label class="form-label">GROWTH %</label><input class="form-input" id="rrsp-growth" type="number" step="0.1"></div>
<div class="form-group"><label class="form-label">DIV/SHARE</label><input class="form-input" id="rrsp-divPerShare" type="number" step="0.01"></div>
</div>
<div class="form-group"><label class="form-label">NOTE</label><input class="form-input" id="rrsp-note"></div>
<div class="modal-actions">
<button class="btn" onclick="closeModal('rrsp-modal')">Cancel</button>
<button class="btn btn-danger" id="rrsp-delete-btn" onclick="deleteHolding()">Delete</button>
<button class="btn btn-primary" onclick="saveRrsp()">Save</button>
</div>
</div>
</div>

<!-- RRSP Meta Modal -->
<div class="modal" id="rrsp-meta-modal">
<div class="modal-content">
<div class="modal-title">Account Settings</div>
<div class="form-group"><label class="form-label">MONTHLY CONTRIBUTION (CAD)</label><input class="form-input" id="meta-monthly" type="number" step="1"></div>
<div class="form-group"><label class="form-label">TARGET AGE</label><input class="form-input" id="meta-age" type="number" step="1"></div>
<div class="form-group"><label class="form-label">YEARS TO TARGET</label><input class="form-input" id="meta-years" type="number" step="1"></div>
<div class="modal-actions">
<button class="btn" onclick="closeModal('rrsp-meta-modal')">Cancel</button>
<button class="btn btn-primary" onclick="saveMeta()">Save</button>
</div>
</div>
</div>

<!-- Swing Edit Modal -->
<div class="modal" id="swing-modal">
<div class="modal-content">
<div class="modal-title" id="swing-modal-title">Add Ticker</div>
<div class="form-row">
<div class="form-group"><label class="form-label">TICKER</label><input class="form-input" id="swing-ticker"></div>
<div class="form-group"><label class="form-label">SIGNAL</label><select class="form-select" id="swing-signal"><option>LONG</option><option>SHORT</option><option>HOLD</option></select></div>
</div>
<div class="form-group"><label class="form-label">COMPANY NAME</label><input class="form-input" id="swing-name"></div>
<div class="form-row">
<div class="form-group"><label class="form-label">PRICE</label><input class="form-input" id="swing-price" type="number" step="0.01"></div>
<div class="form-group"><label class="form-label">SCORE /100</label><input class="form-input" id="swing-score" type="number" step="1"></div>
<div class="form-group"><label class="form-label">TREND</label><select class="form-select" id="swing-trend"><option>BULL</option><option>BEAR</option><option>MIXED</option></select></div>
</div>
<div class="form-row">
<div class="form-group"><label class="form-label">TP</label><input class="form-input" id="swing-tp" type="number" step="0.01"></div>
<div class="form-group"><label class="form-label">SL</label><input class="form-input" id="swing-sl" type="number" step="0.01"></div>
<div class="form-group"><label class="form-label">R:R</label><input class="form-input" id="swing-rr"></div>
</div>
<div class="form-group"><label class="form-label">NOTE</label><input class="form-input" id="swing-note"></div>
<div class="modal-actions">
<button class="btn" onclick="closeModal('swing-modal')">Cancel</button>
<button class="btn btn-danger" id="swing-delete-btn" onclick="deleteSwing()">Delete</button>
<button class="btn btn-primary" onclick="saveSwing()">Save</button>
</div>
</div>
</div>

<script>
let STATE = { trades:[], stats:null, rrsp:null, swing:[], tab:'daytrade', price:0, priceChange:0, priceChangePct:0, vix:0, vixRegime:'--', candles:[], live:false, swingFilter:'ALL', editingTicker:null };
const API = '';

function switchTab(tab) {
  STATE.tab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
}

async function fetchData() {
  try {
    const [tr, st, mk, rr, sw] = await Promise.all([
      fetch(API+'/api/trades'), fetch(API+'/api/stats'), fetch(API+'/api/market'),
      fetch(API+'/api/rrsp'), fetch(API+'/api/swing')
    ]);
    STATE.trades = (await tr.json()).trades;
    STATE.stats = await st.json();
    const market = await mk.json();
    if (market.es && market.es.price) {
      STATE.price = market.es.price;
      STATE.priceChange = market.es.change || 0;
      STATE.priceChangePct = market.es.changePct || 0;
      STATE.candles = market.es.candles || [];
    }
    if (market.vix && market.vix.value) {
      STATE.vix = market.vix.value;
      STATE.vixRegime = market.vix.regime || '--';
    }
    STATE.live = market.live || false;
    STATE.rrsp = await rr.json();
    STATE.swing = (await sw.json()).watchlist || [];
  } catch(e) { console.log('Fetch error:', e); }
  render();
}

function render() {
  if (!STATE.stats) return;
  const status = STATE.live ? '🟢 LIVE' : '🔴 OFFLINE';
  document.getElementById('subtitle').textContent = `ES · 5min · ${status} · ${new Date().toLocaleDateString()}`;
  const vc = STATE.vix < 15 ? '--green' : STATE.vix > 25 ? '--red' : '--gold';
  const vb = document.getElementById('vix-badge');
  vb.style.background = `var(${vc})12`;
  vb.style.borderColor = `var(${vc})33`;
  vb.querySelector('.vix-dot').style.background = `var(${vc})`;
  vb.querySelector('.vix-dot').style.boxShadow = `0 0 6px var(${vc})`;
  document.getElementById('vix-text').textContent = STATE.vix > 0 ? `VIX ${STATE.vix.toFixed(1)}` : 'VIX --';
  document.getElementById('vix-text').style.color = `var(${vc})`;
  document.getElementById('vix-regime').textContent = STATE.vixRegime;
  renderDayTrade(); renderSwing(); renderRrsp(); renderTrades(); renderStats();
}

function renderDayTrade() {
  const el = document.getElementById('page-daytrade');
  const candles = STATE.candles.length > 0 ? STATE.candles : generateCandles(60);
  const price = STATE.price > 0 ? STATE.price : candles[candles.length-1].c;
  const k=2/22; let ema=candles[0].c;
  for(let i=1;i<candles.length;i++) ema = candles[i].c*k + ema*(1-k);
  const bgl = ema;
  let orbH=0, orbL=999999;
  for(let i=0;i<Math.min(6,candles.length);i++){ orbH=Math.max(orbH,candles[i].h); orbL=Math.min(orbL,candles[i].l); }
  let sumTP=0; candles.forEach(c=>sumTP+=(c.h+c.l+c.c)/3); const vwap=sumTP/candles.length;
  const above = price > bgl;
  const bglSig = above ? 'LONG' : 'SHORT';
  const bglConf = above ? (price-bgl>5?72:55) : (bgl-price>5?72:55);
  const orbSig = price>orbH?'LONG':price<orbL?'SHORT':null;
  const orbConf = orbSig?60:null;
  let confLong=0, confShort=0;
  if (STATE.vixRegime === 'MODERATE' || STATE.vixRegime === 'HIGH VOL') { confLong++; confShort++; }
  if (above) confLong++; else confShort++;
  if (price > orbH) confLong++;
  if (price < orbL) confShort++;
  const bestDir = confLong >= confShort ? 'BULLISH' : 'BEARISH';
  const bestConf = Math.max(confLong, confShort);
  const bestColor = bestConf>=3?'--green':bestConf>=2?'--gold':'--red';
  const change = STATE.priceChange, pct = STATE.priceChangePct;
  const chColor = change>=0?'var(--green)':'var(--red)';
  const chSign = change>=0?'+':'';
  el.innerHTML = `
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">
      <span class="price-big mono">${price.toFixed(2)}</span>
      <span class="price-change mono" style="color:${chColor}">${chSign}${change.toFixed(2)} (${chSign}${pct.toFixed(2)}%)</span>
    </div>
    <div style="font-size:9px;color:var(--dim);font-family:monospace;margin-bottom:8px">Confluence: ${bestDir} ${bestConf}/4</div>
    <div class="card" style="padding:0;overflow:hidden"><canvas id="chart-canvas" height="220"></canvas></div>
    <div style="display:flex;flex-wrap:wrap;margin:12px 0">
      ${indBadge('BGL 21', bgl.toFixed(1), '--bgl')}
      ${indBadge('ORB Hi', orbH.toFixed(1), '--blue')}
      ${indBadge('ORB Lo', orbL>99999?'--':orbL.toFixed(1), '--purple')}
      ${indBadge('VWAP', vwap.toFixed(1), '--gold')}
    </div>
    <div class="section-title mono"><span>STRATEGY SIGNALS</span></div>
    ${signalCard('Black ASP v1.1.0', bglSig, 65, `ES @ ${price.toFixed(1)} · VIX: ${STATE.vix.toFixed(1)} ${STATE.vixRegime}`, true)}
    ${signalCard('BGL (21 EMA)', bglSig, bglConf, above?'Price above BGL · Trending up':'Price below BGL · Trending down', true)}
    ${signalCard('ORB Breakout', orbSig, orbConf, orbSig?`Price ${orbSig==='LONG'?'above':'below'} ORB ${orbSig==='LONG'?'high '+orbH.toFixed(1):'low '+orbL.toFixed(1)}`:'Waiting — inside opening range', !!orbSig)}
    ${signalCard('VIX Regime', null, null, `VIX ${STATE.vix.toFixed(1)} = ${STATE.vixRegime} · Trend trades valid`, false)}
    <div class="confluence-box" style="background:var(${bestColor})0a;border:1px solid var(${bestColor})30">
      <div class="confluence-title mono" style="color:var(${bestColor})">CONFLUENCE: ${bestDir} (${bestConf}/4)</div>
      <div class="confluence-desc">${bestConf>=3?'High conviction — multiple strategies aligned.':bestConf>=2?'Moderate confluence — wait for confirmation.':'Low confluence — stand aside or reduce size.'}</div>
    </div>
  `;
  drawCandlestickChart('chart-canvas', candles, 220);
}

function renderSwing() {
  const el = document.getElementById('page-swing');
  const filtered = STATE.swingFilter === 'ALL' ? STATE.swing : STATE.swing.filter(s => s.signal === STATE.swingFilter);
  el.innerHTML = `
    <div class="section-title mono">
      <span>SWING SCANNER</span>
      <button class="btn btn-sm btn-primary" onclick="openSwingModal()">+ Add</button>
    </div>
    <div style="font-size:9px;color:var(--muted);margin-bottom:10px">VectorVest-style scoring · Tap any card to edit</div>
    <div style="margin-bottom:12px">
      ${['ALL','LONG','SHORT','HOLD'].map(f=>`<button class="filter-btn ${STATE.swingFilter===f?'active':''}" onclick="setSwingFilter('${f}')">${f}</button>`).join('')}
    </div>
    ${filtered.map(s => {
      const sc = s.signal==='LONG'?'--green':s.signal==='SHORT'?'--red':'--gold';
      return `<div class="card" onclick="openSwingModal('${s.ticker}')" style="cursor:pointer">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div><span style="font-size:14px;font-weight:700" class="mono">${s.ticker}</span><span style="font-size:10px;color:var(--dim);margin-left:8px">${s.name||''}</span></div>
          <div style="text-align:right"><div style="font-size:14px;font-weight:700" class="mono">$${Number(s.price).toFixed(2)}</div>
          <span class="signal-badge mono" style="color:var(${sc});background:var(${sc})18">${s.signal}</span></div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap">
          <div class="mono" style="font-size:9px;color:var(--dim)">Score: <span style="color:var(${sc});font-weight:700">${s.score}/100</span></div>
          <div class="mono" style="font-size:9px;color:var(--dim)">Trend: <span style="color:${s.trend==='BULL'?'var(--green)':s.trend==='BEAR'?'var(--red)':'var(--gold)'}">${s.trend}</span></div>
          <div class="mono" style="font-size:9px;color:var(--dim)">R:R: <span style="color:var(--text)">${s.rr||'--'}</span></div>
        </div>
        <div style="display:flex;gap:12px;margin-bottom:4px">
          <span class="mono" style="font-size:9px;color:var(--green)">TP: $${s.tp}</span>
          <span class="mono" style="font-size:9px;color:var(--red)">SL: $${s.sl}</span>
        </div>

function generateCandles(n) {
  const c = []; let p = 6800;
  for (let i=0;i<n;i++) {
    const o = p + (Math.random()-.48)*15;
    const cl = o + (Math.random()-.48)*20;
    const h = Math.max(o,cl)+Math.random()*10;
    const l = Math.min(o,cl)-Math.random()*10;
    c.push({o,h,l,c:cl,t:i}); p = cl;
  } return c;
}

function drawCandlestickChart(id, candles, height) {
  const canvas = document.getElementById(id); if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth;
  canvas.width = w * dpr; canvas.height = height * dpr;
  canvas.style.width = w+'px'; canvas.style.height = height+'px';
  ctx.scale(dpr, dpr);
  const pad = {t:10,r:8,b:20,l:45};
  const cw = w-pad.l-pad.r, ch = height-pad.t-pad.b;
  const allP = candles.flatMap(c=>[c.h,c.l]);
  const minP = Math.min(...allP), maxP = Math.max(...allP), range = maxP-minP||1;
  const gap = cw/candles.length, candleW = Math.max(2, gap*.7);
  const toY = p => pad.t+ch-((p-minP)/range)*ch;
  ctx.strokeStyle='#1a1a28'; ctx.lineWidth=.5;
  ctx.font='9px monospace'; ctx.fillStyle='#3d3d50'; ctx.textAlign='right';
  for(let i=0;i<5;i++){ const p=minP+(range/4)*i, y=toY(p);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();
    ctx.fillText(p.toFixed(0),pad.l-4,y+3);
  }
  const k=2/22; let ema=[candles[0].c];
  for(let i=1;i<candles.length;i++) ema.push(candles[i].c*k+ema[i-1]*(1-k));
  ctx.beginPath(); ctx.strokeStyle='#00e67699'; ctx.lineWidth=1.5;
  ema.forEach((v,i)=>{const x=pad.l+i*gap+gap/2; i===0?ctx.moveTo(x,toY(v)):ctx.lineTo(x,toY(v))});
  ctx.stroke();
  candles.forEach((c,i)=>{
    const x=pad.l+i*gap+gap/2; const bull=c.c>=c.o; const col=bull?'#2ecc71':'#e74c3c';
    ctx.strokeStyle=col;ctx.lineWidth=.8;
    ctx.beginPath();ctx.moveTo(x,toY(c.h));ctx.lineTo(x,toY(c.l));ctx.stroke();
    const bt=toY(Math.max(c.o,c.c)),bb=toY(Math.min(c.o,c.c));
    ctx.fillStyle=col;ctx.globalAlpha=.9;
    ctx.fillRect(x-candleW/2,bt,candleW,Math.max(1,bb-bt));ctx.globalAlpha=1;
  });
  const last=candles[candles.length-1], py=toY(last.c);
  ctx.setLineDash([3,3]);ctx.strokeStyle='#f1c40f';ctx.lineWidth=.5;
  ctx.beginPath();ctx.moveTo(pad.l,py);ctx.lineTo(w-pad.r,py);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#f1c40f';
  const lw=44,lh=14;ctx.fillRect(w-pad.r-lw,py-lh/2,lw,lh);
  ctx.fillStyle='#000';ctx.font='bold 8px monospace';ctx.textAlign='center';
  ctx.fillText(last.c.toFixed(1),w-pad.r-lw/2,py+3);
}

function drawEquityCurve(id, curve, height) {
  const canvas = document.getElementById(id); if (!canvas) return;
  const ctx = canvas.getContext('2d');
